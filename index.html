<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nordiska Namnsdagar</title>
  <style>
    :root {
      --blue: #006AA7;
      --yellow: #FECC02;
      --light-blue: #dceefb;
      --text: #1a1a2e;
      --white: #ffffff;
      --gray: #f4f6f9;
      --border: #d0d7de;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--gray);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--blue);
      color: var(--white);
      padding: 1.2rem 2rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    header h1 {
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.8;
      margin-top: 0.2rem;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Today card */
    .today-card {
      background: var(--blue);
      color: var(--white);
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      text-align: center;
      border-top: 5px solid var(--yellow);
      box-shadow: 0 2px 8px rgba(0, 106, 167, 0.3);
    }

    .today-card .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.75;
      margin-bottom: 0.4rem;
    }

    .today-card .date {
      font-size: 1.2rem;
      margin-bottom: 0.8rem;
      opacity: 0.9;
    }

    .today-card .names {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--yellow);
    }

    .today-card .no-nameday {
      font-size: 1.3rem;
      opacity: 0.65;
      font-style: italic;
    }

    /* Search section */
    .search-section {
      background: var(--white);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .search-section h2 {
      font-size: 1rem;
      color: var(--blue);
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .search-row {
      display: flex;
      gap: 0.5rem;
    }

    .search-row input {
      flex: 1;
      padding: 0.65rem 1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-row input:focus {
      border-color: var(--blue);
    }

    .search-row button {
      padding: 0.65rem 1.4rem;
      background: var(--blue);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .search-row button:hover {
      background: #005a8e;
    }

    .search-result {
      margin-top: 1rem;
      padding: 0.9rem 1.1rem;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
    }

    .search-result.found {
      background: var(--light-blue);
      border-left: 4px solid var(--blue);
    }

    .search-result.not-found {
      background: #fff3cd;
      border-left: 4px solid #f0a500;
    }

    /* Calendar grid */
    .calendar-section h2 {
      font-size: 1.3rem;
      color: var(--blue);
      margin-bottom: 1.2rem;
      font-weight: 700;
    }

    .months-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.2rem;
    }

    .month-card {
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .month-header {
      background: var(--blue);
      color: var(--white);
      padding: 0.75rem 1.2rem;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.3px;
    }

    .days-list {
      padding: 0.4rem 0.5rem;
    }

    .day-row {
      display: grid;
      grid-template-columns: 2.2rem 1fr;
      gap: 0.5rem;
      padding: 0.28rem 0.6rem;
      border-radius: 6px;
      align-items: baseline;
    }

    .day-row:hover {
      background: var(--light-blue);
    }

    .day-row.today {
      background: var(--yellow);
      font-weight: 600;
    }

    .day-num {
      color: var(--blue);
      font-weight: 600;
      font-size: 0.82rem;
      text-align: right;
    }

    .day-row.today .day-num {
      color: #555;
    }

    .day-names {
      font-size: 0.88rem;
      color: var(--text);
    }

    .day-row.no-name .day-names {
      color: #aaa;
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: #777;
      font-size: 0.82rem;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.3rem; }
      .today-card .names { font-size: 1.6rem; }
      .months-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>&#10010; Nordiska Namnsdagar</h1>
  <p>Svenska namnsdagar för hela året</p>
</header>

<main>
  <div class="today-card" id="today-card"></div>

  <div class="search-section">
    <h2>&#128269; Sök namnsdagsnamn</h2>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Skriv ett namn…" aria-label="Sök namnsdagsnamn">
      <button onclick="searchName()">Sök</button>
    </div>
    <div class="search-result" id="search-result"></div>
  </div>

  <div class="calendar-section">
    <h2>&#128197; Alla namnsdagar</h2>
    <div class="months-grid" id="months-grid"></div>
  </div>
</main>

<footer>
  <p>Svenska namnsdagar &mdash; officiell kalender</p>
</footer>

const MONTHS_SV = [
  "", "Januari", "Februari", "Mars", "April", "Maj", "Juni",
  "Juli", "Augusti", "September", "Oktober", "November", "December"
];

function getNames(month, day) {
  const m = NAMEDAYS[month];
  if (!m) return [];
  return m[day] || [];
}

function isLeapYear(year) {
  return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
}

function daysInMonth(month, year) {
  return new Date(year, month, 0).getDate();
}

function formatDate(date) {
  return date.toLocaleDateString("sv-SE", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });
}

// Render today's name day card
function renderToday() {
  const today = new Date();
  const m = today.getMonth() + 1;
  const d = today.getDate();
  const names = getNames(m, d);
  const card = document.getElementById("today-card");
  card.innerHTML = `
    <div class="label">Idag firas</div>
    <div class="date">${formatDate(today)}</div>
    ${names.length
      ? `<div class="names">${names.join(" & ")}</div>`
      : `<div class="no-nameday">Ingen namnsdag idag</div>`}
  `;
}

// Build the full calendar grid
function renderCalendar() {
  const today = new Date();
  const todayM = today.getMonth() + 1;
  const todayD = today.getDate();
  const year = today.getFullYear();
  const grid = document.getElementById("months-grid");

  for (let m = 1; m <= 12; m++) {
    const days = daysInMonth(m, year);
    const card = document.createElement("div");
    card.className = "month-card";

    let rows = "";
    for (let d = 1; d <= days; d++) {
      // daysInMonth() returns the correct number of days for the year, including leap years
      const names = getNames(m, d);
      const isToday = m === todayM && d === todayD;
      const rowClass = isToday ? "day-row today" : (names.length === 0 ? "day-row no-name" : "day-row");
      rows += `<div class="${rowClass}">
        <span class="day-num">${d}</span>
        <span class="day-names">${names.length ? names.join(", ") : "&mdash;"}</span>
      </div>`;
    }

    card.innerHTML = `
      <div class="month-header">${MONTHS_SV[m]}</div>
      <div class="days-list">${rows}</div>
    `;
    grid.appendChild(card);
  }
}

// Search for a name
function searchName() {
  const query = document.getElementById("search-input").value.trim().toLowerCase();
  const resultEl = document.getElementById("search-result");

  if (!query) {
    resultEl.style.display = "none";
    return;
  }

  const matches = [];
  for (let m = 1; m <= 12; m++) {
    const monthData = NAMEDAYS[m];
    for (const [day, names] of Object.entries(monthData)) {
      for (const name of names) {
        if (name.toLowerCase().includes(query)) {
          matches.push({ month: m, day: parseInt(day, 10), name });
        }
      }
    }
  }

  resultEl.style.display = "block";
  if (matches.length > 0) {
    resultEl.className = "search-result found";
    const list = matches.map(
      ({ month, day, name }) =>
        `<strong>${name}</strong> firas den <strong>${day} ${MONTHS_SV[month]}</strong>`
    ).join("<br>");
    resultEl.innerHTML = list;
  } else {
    resultEl.className = "search-result not-found";
    resultEl.innerHTML = `Inget namn hittades för &ldquo;<strong>${query}</strong>&rdquo;`;
  }
}

// Allow searching with Enter key
document.getElementById("search-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") searchName();
});

// Initialise
renderToday();
renderCalendar();
</script>
